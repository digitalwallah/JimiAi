name: Setup Signing (one-time)

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore jimi-release-key.jks \
            -alias jimi_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "JimiSecure123!" \
            -keypass "JimiSecure123!" \
            -dname "CN=Jimi, OU=Jimi, O=Jimi, L=City, S=State, C=IN"

      - name: Verify keystore is valid
        run: keytool -list -keystore jimi-release-key.jks -storepass "JimiSecure123!"

      - name: Push secrets to repo (no manual copy-paste needed)
        env:
          GH_TOKEN: ${{ secrets.TEMP_PAT }}
        run: |
          base64 -w 0 jimi-release-key.jks | gh secret set KEYSTORE_BASE64 --repo digitalwallah/JimiAi
          echo -n "JimiSecure123!" | gh secret set KEYSTORE_PASSWORD --repo digitalwallah/JimiAi
          echo -n "jimi_key" | gh secret set KEY_ALIAS --repo digitalwallah/JimiAi
          echo -n "JimiSecure123!" | gh secret set KEY_PASSWORD --repo digitalwallah/JimiAi

      - name: Backup keystore as artifact (download and save this safely!)
        uses: actions/upload-artifact@v4
        with:
          name: jimi-keystore-BACKUP
          path: jimi-release-key.jks
